workflows:
  # ============================================================
  # 1) Build IPA non-signé — pour sideload (sans compte Developer)
  # ============================================================
  ios-unsigned-build:
    name: iOS - Build IPA sans compte Developer
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    working_directory: apps/mobile

    scripts:
      - name: Récupérer les dépendances Flutter
        script: |
          flutter pub get

      - name: Build iOS sans signature de code
        script: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER

      - name: Créer l'IPA non-signé
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Erreur : $APP_PATH introuvable"
            ls build/ios/iphoneos/ || true
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          zip -r "$CM_BUILD_DIR/EchangoPromo-unsigned.ipa" Payload/

          echo "IPA créé : $CM_BUILD_DIR/EchangoPromo-unsigned.ipa"
          ls -lh "$CM_BUILD_DIR/EchangoPromo-unsigned.ipa"

    artifacts:
      - $CM_BUILD_DIR/EchangoPromo-unsigned.ipa

  # ============================================================
  # 2) Build signé + upload TestFlight
  # ----------------------------------------------------------
  # Signature gérée par Codemagic via `ios_signing`, et non plus à la main
  # (`keychain initialize`, `openssl genrsa`, `fetch-signing-files`,
  # `keychain add-certificates`). Ces quatre étapes échouaient dès la
  # première, sans message exploitable ; Codemagic fait exactement la même
  # chose de façon maintenue, à partir de l'intégration ci-dessous.
  #
  # Pré-requis, une seule fois :
  #   1. Codemagic → Teams → Integrations → App Store Connect → Add key
  #      avec les trois valeurs déjà en main (Issuer ID, Key ID, .p8).
  #      Le NOM donné à cette clé doit être recopié dans `integrations`
  #      ci-dessous, au caractère près.
  #   2. App créée dans App Store Connect avec le bundle id
  #      com.echango.promo (voir docs/DEPLOIEMENT_STORES.md).
  #
  # Le groupe de variables `appstore_credentials` n'est plus nécessaire :
  # l'intégration porte les mêmes identifiants, sans les dupliquer.
  # ============================================================
  ios-testflight-build:
    name: iOS - Build signé + TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      # ⚠️ À remplacer par le nom exact donné à la clé dans
      # Teams → Integrations → App Store Connect.
      app_store_connect: Echango App Store Connect

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.echango.promo
      flutter: stable
      xcode: latest
      cocoapods: default

    working_directory: apps/mobile

    scripts:
      - name: Appliquer les profils de signature au projet Xcode
        script: |
          # Codemagic a déjà récupéré certificat et profil depuis
          # l'intégration : cette commande les câble dans le projet et
          # génère /Users/builder/export_options.plist utilisé au build.
          xcode-project use-profiles

      - name: Récupérer les dépendances Flutter
        script: |
          flutter pub get

      - name: Installer les pods iOS
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Build IPA signé
        script: |
          # `$PROJECT_BUILD_NUMBER` est le compteur de Codemagic : il
          # augmente à chaque build et ne collisionne jamais. Évite
          # d'interroger TestFlight, qui échoue tant qu'aucune build
          # n'existe — c'est-à-dire au tout premier envoi.
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Copier l'IPA vers le répertoire de build CodeMagic
        script: |
          # `working_directory: apps/mobile` rend les paths d'artifacts ambigus.
          # On copie explicitement l'IPA vers $CM_BUILD_DIR pour que la
          # section `publishing` et `artifacts` la trouvent à coup sûr.
          mkdir -p "$CM_BUILD_DIR"
          cp build/ios/ipa/*.ipa "$CM_BUILD_DIR/EchangoPromo.ipa"
          ls -lh "$CM_BUILD_DIR/EchangoPromo.ipa"

    artifacts:
      - $CM_BUILD_DIR/EchangoPromo.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # `auth: integration` réutilise la clé déclarée dans `integrations`,
        # plutôt que de redonner Issuer ID / Key ID / .p8 en variables.
        auth: integration
        submit_to_testflight: true
        # beta_groups: liste des groupes TestFlight qui reçoivent la build
        # beta_groups:
        #   - "Beta interne Echango Promo"
