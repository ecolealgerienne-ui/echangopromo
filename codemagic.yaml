workflows:
  # ============================================================
  # 1) Build IPA non-signé — pour sideload (sans compte Developer)
  # ============================================================
  ios-unsigned-build:
    name: iOS - Build IPA sans compte Developer
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    working_directory: apps/mobile

    scripts:
      - name: Récupérer les dépendances Flutter
        script: |
          flutter pub get

      - name: Build iOS sans signature de code
        script: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.0 \
            --build-number=$((BUILD_NUMBER))

      - name: Créer l'IPA non-signé
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Erreur : $APP_PATH introuvable"
            ls build/ios/iphoneos/ || true
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          zip -r "$CM_BUILD_DIR/EchangoPromo-unsigned.ipa" Payload/

          echo "IPA créé : $CM_BUILD_DIR/EchangoPromo-unsigned.ipa"
          ls -lh "$CM_BUILD_DIR/EchangoPromo-unsigned.ipa"

    artifacts:
      - $CM_BUILD_DIR/EchangoPromo-unsigned.ipa

  # ============================================================
  # 2) Build signé + upload TestFlight
  # ----------------------------------------------------------
  # Pré-requis (une seule fois, voir docs/DEPLOIEMENT_STORES.md) :
  #   - Compte Apple Developer ($99/an)
  #   - App ID créé dans App Store Connect (bundle id : com.echango.promo)
  #   - App Store Connect API Key uploadée dans CodeMagic
  #     → Codemagic / Teams / Integrations / App Store Connect
  #   - Variables ajoutées dans le groupe `appstore_credentials` :
  #       APP_STORE_CONNECT_KEY_IDENTIFIER (Key ID)
  #       APP_STORE_CONNECT_ISSUER_ID
  #       APP_STORE_CONNECT_PRIVATE_KEY (.p8 base64)
  # ============================================================
  ios-testflight-build:
    name: iOS - Build signé + TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.echango.promo"
        APP_STORE_APPLE_ID: "0000000000" # Apple ID numérique de l'app Echango Promo dans App Store Connect
      # Pas de bloc `ios_signing` ici : on gère le signing manuellement via
      # les scripts ci-dessous (app-store-connect fetch-signing-files
      # --create) pour avoir un meilleur contrôle. Mettre les deux entre
      # en conflit ("No matching profiles found").

    working_directory: apps/mobile

    scripts:
      - name: Initialiser le keychain
        script: |
          keychain initialize

      - name: Générer une clé privée RSA pour le certificat iOS
        script: |
          # CodeMagic CLI ne génère pas la clé privée automatiquement.
          # On la fournit via `--certificate-key=@file:` ci-dessous.
          openssl genrsa -out /tmp/cert_key.pem 2048

      - name: Récupérer / générer le profil App Store + certificat
        script: |
          # `--create` : crée le cert iOS Distribution ET le profil
          # App Store pour notre bundle id si l'un ou l'autre manque.
          # `--certificate-key=@file:` : indique la clé privée à utiliser
          # pour signer le CSR (sans ça, "Cannot save Signing Certificates
          # without certificate private key").
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create

      - name: Ajouter le certificat au keychain
        script: |
          keychain add-certificates

      - name: Configurer Xcode pour utiliser les profils
        script: |
          xcode-project use-profiles

      - name: Récupérer les dépendances Flutter
        script: |
          flutter pub get

      - name: Installer les pods iOS
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Build IPA signé
        script: |
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Copier l'IPA vers le répertoire de build CodeMagic
        script: |
          # `working_directory: apps/mobile` rend les paths d'artifacts ambigus.
          # On copie explicitement l'IPA vers $CM_BUILD_DIR pour que la
          # section `publishing` et `artifacts` la trouvent à coup sûr.
          mkdir -p "$CM_BUILD_DIR"
          cp build/ios/ipa/*.ipa "$CM_BUILD_DIR/EchangoPromo.ipa"
          ls -lh "$CM_BUILD_DIR/EchangoPromo.ipa"

    artifacts:
      - $CM_BUILD_DIR/EchangoPromo.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # submit_to_testflight: true → la build est dispo dans TestFlight automatiquement
        submit_to_testflight: true
        # beta_groups: liste des groupes TestFlight qui reçoivent la build
        # beta_groups:
        #   - "Beta interne Echango Promo"
