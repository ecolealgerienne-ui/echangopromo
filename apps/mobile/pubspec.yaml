name: echango_promo
description: echango Promo - Application mobile client, commerçant & agent terrain
publish_to: 'none'
# ⚠️ **Seule source de vérité de la version, pour les DEUX stores** depuis le
# 2026-08-16 : `android/app/build.gradle.kts` la lit déjà (`flutter.versionCode`
# / `versionName`), et `codemagic.yaml` ne la surcharge plus. Voir
# `docs/BUILD_ANDROID.md`.
#
# ⚠️ **Le `+18` n'est pas un incrément de 1 : c'est le maximum des deux stores,
# plus un.** Au 2026-08-16, Apple avait reçu la build **17** (version 1.0.1,
# refusée pour ITMS-91061) et Google le code **12** (version 1.0.0, en examen).
# Un seul `pubspec` alimente les deux, donc il doit dépasser le plus avancé —
# sinon c'est celui-là qui refuse, et son message ne parlera pas de `pubspec`.
#
# ⚠️ **Un numéro ne se réutilise ni ne redescend jamais**, même après un refus :
# la 17 est brûlée bien qu'Apple l'ait rejetée. Chaque envoi demande donc un
# commit ici — et c'est précisément ce qui rend la correspondance
# version ↔ commit vérifiable, ce qu'aucun compteur de CI ne sait faire.
version: 1.0.1+18

environment:
  # ⚠️ Borne basse montée de 3.2.0 à 3.4.0 le 2026-08-16, **imposée par
  # `share_plus ^10.1.4`** (lui-même imposé par Apple, voir sa dépendance
  # ci-dessous). Pas un rafraîchissement de confort : `pub` refuse de résoudre
  # tant que la borne de l'app autorise un SDK que la dépendance exclut.
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0

  # Typographie du design system (Cairo + IBM Plex Sans Arabic — support
  # natif FR/EN/AR, voir apps/mobile/lib/app/theme.dart)
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^14.0.0

  # API REST
  dio: ^5.7.0

  # UI
  cached_network_image: ^3.4.0

  # Stockage local (device ID anonyme, favoris, point de recherche)
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0
  uuid: ^4.4.0

  # Photo promo (agent) — capture caméra obligatoire, pas de galerie
  image_picker: ^1.1.0

  # Position GPS du commerce (gratuit, pas de clé API Google Maps) et lien
  # "Itinéraire" ouvrant l'app Google Maps côté client
  geolocator: ^13.0.1
  url_launcher: ^6.3.0

  # Carte "autour de moi" — tuiles OpenStreetMap, pour la même raison que
  # geolocator : aucune clé API ni compte de facturation Google.
  # Le regroupement des commerces en "ronds" est calculé dans
  # `features/client/utils/marker_cluster.dart`, sans package de clustering
  # supplémentaire : ceux-ci suivent avec retard les versions majeures de
  # flutter_map et bloqueraient `flutter pub get` (règle d'audit #18).
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Compression avant upload — §5.8 des specs
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Partage d'une promo (texte + photo) vers le sélecteur natif du
  # téléphone (WhatsApp, Telegram, SMS...) — croissance organique
  #
  # ⚠️ **`^10.1.4` et pas moins : c'est une contrainte de CONFORMITÉ, pas de
  # confort.** La 7.2.2 ne porte aucun `PrivacyInfo.xcprivacy` — mesuré, son
  # dossier `ios/` ne contient que `Classes/` et le podspec — et Apple a refusé
  # la soumission 1.0.1 (17) le 2026-08-16 pour ce seul motif (ITMS-91061,
  # `share_plus` figure sur la liste des SDK tiers courants d'Apple). Détail et
  # balayage de toutes les dépendances : `docs/RETOURS_APPLE.md`, cas R4.
  #
  # ⚠️ **Ne pas monter en 12+ sans y toucher** : l'API statique
  # `Share.share(...)` / `Share.shareXFiles(...)` y est remplacée par
  # `SharePlus.instance.share(ShareParams(...))`, ce qui demanderait de
  # réécrire les deux appels de `promo_detail_screen.dart`.
  share_plus: ^10.1.4

  # Version non épinglée en dur : flutter_localizations (SDK) impose sa
  # propre contrainte sur intl, liée à la version exacte du SDK Flutter
  # installé — un pin exact (`0.20.2`) peut bloquer `flutter pub get` selon
  # le SDK réellement utilisé (audit vérifiabilité mobile).
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Parcours joués sur l'appareil (étape 3 de docs/METHODE_TEST.md) —
  # `integration_test/`, lancé par `scripts/test-parcours-ecran.sh`.
  integration_test:
    sdk: flutter
  # Uniquement pour DOUBLER la galerie du système dans le parcours de création
  # de promo (`integration_test/faux_selecteur_photo.dart`) : `integration_test`
  # pilote notre arbre de widgets, pas les applications tierces qui s'ouvrent
  # par-dessus. Déjà présent comme dépendance transitive d'`image_picker` —
  # ici seulement pour avoir le droit de l'importer.
  #
  # Contrainte large et non épinglée : c'est `image_picker` qui commande la
  # version réellement résolue (règle #18).
  image_picker_platform_interface: ^2.10.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    # Déclaration séparée : côté Flutter, `assets/images/` n'inclut que les
    # fichiers directement dans ce dossier, pas ses sous-dossiers.
    - assets/images/brand/
    # Visuels de catégorie, facultatifs : `categorieAssetPath()` retombe sur
    # une icône Material tant que le fichier n'est pas déposé (voir le README
    # du dossier pour les noms attendus).
    - assets/images/categories/
