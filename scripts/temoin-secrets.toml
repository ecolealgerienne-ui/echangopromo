# TÉMOIN DE CHAÎNE — utilisé UNIQUEMENT par `audit-secrets.sh --self-test`.
# Jamais par l'audit réel.
#
# ── Pourquoi ce fichier existe ──────────────────────────────────────────────
#
# Le résultat NORMAL d'un audit de secrets est « rien à signaler » — exactement
# l'affichage d'un audit qui aurait scanné un dossier vide, perdu sa
# configuration ou mal monté son volume. Trois façons de rendre un vert
# mensonger, et aucune ne produit d'erreur.
#
# Le témoin le plus fort serait une fuite RÉELLE du dépôt, rejouée à chaque
# auto-test. **Ce dépôt n'en a pas** : les couples téléphone/PIN de l'historique
# sont du décor de banc (voir `.gitleaks.toml`). C'est un bon résultat, mais il
# laisserait le scénario SC-SEC.40 en « n'a rien mesuré » à vie — et un contrôle
# perpétuellement incomplet finit ignoré, ce qui revient à ne pas l'avoir.
#
# D'où ce témoin : une règle jetable qui vise une chaîne dont on SAIT qu'elle est
# dans l'historique, et qui n'est pas un secret.
#
# ── Ce qu'il prouve, et ce qu'il ne prouve PAS ──────────────────────────────
#
# ✅ IL PROUVE que toute la chaîne travaille : le dépôt est monté et non vide,
#    l'historique git est réellement parcouru, un fichier de configuration est
#    chargé, et une règle maison se déclenche.
#
# ❌ IL NE PROUVE PAS qu'une vraie fuite serait vue. Pour ça il faudrait une
#    vraie fuite. Cette distinction doit rester écrite dans le rapport : ce vert
#    couvre la mécanique, pas la couverture des règles.
#
# ⚠️ Ce témoin CROÎT avec les commits — d'où `TEMOIN_MIN` et non `TEMOIN_COMPTE`
# dans `audit-secrets.sh`. Un compte exact ferait rougir l'audit au prochain
# commit qui mentionne un numéro de décor, sur un outil parfaitement correct.

title = "echango Promo — témoin de chaîne (auto-test uniquement)"

[extend]
# Pas de règles par défaut : ce fichier ne sert qu'à voir UNE chose. Les règles
# par défaut sont éprouvées séparément par SC-SEC.42, sur un faux jeton.
useDefault = false

[[rules]]
id = "promo-temoin-chaine"
description = "Numéro de décor des bancs, présent dans l'historique — N'EST PAS UN SECRET"
# `+213555000101` est le commerçant de test des bancs. Il apparaît dans
# `scripts/`, dans les `.spec.ts` et dans la documentation de test. Aucun
# `path` : on veut justement qu'il soit trouvé partout où il est.
regex = '''\+213555000101'''
tags = ["temoin", "pas-un-secret"]
